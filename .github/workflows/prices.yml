# Every night: build the price files (build.mjs) and publish them on the
# "data" branch, which the app reads. It also runs after each change on main,
# and "Run workflow" on GitHub starts it by hand.
name: Prices

on:
  schedule:
    # 04:17 UTC = 06:17/07:17 in Israel, after the chains publish their morning full
    # price files (about 05:00-05:20). Not on the hour: GitHub delays scheduled runs
    # most then.
    - cron: '17 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Last night's files, for branches without a fresh price file tonight
      # (there's none before the first run).
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: previous
      - run: npm ci
      # The chains that block computers outside Israel are kept from the run at home.
      - run: node build.mjs
        env:
          RUN_AT: github
      # Only the newest files are kept: the data branch is replaced each night.
      - name: Publish to the data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Prices of $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
